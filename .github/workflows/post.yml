name: Valorant NSFW Bot

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run bot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: python main.py

      - name: Commit state files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add posted.txt
          git add engine_memory.json

          git commit -m "update bot state" || echo "nothing to commit"

          git push